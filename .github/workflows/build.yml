name: Build PS4 Mesa stack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    env:
      REPO_DIR: repo

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Initialize Arch
        shell: bash
        run: |
          set -euxo pipefail

          pacman-key --init
          pacman-key --populate archlinux

          sed -i '/#\[multilib\]/,/Include/s/^#//' /etc/pacman.conf

          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist

          pacman -Syu --noconfirm

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          pacman -S --noconfirm --needed \
            base-devel \
            git \
            sudo \
            fakeroot

      - name: Create builder user
        shell: bash
        run: |
          set -euxo pipefail

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages
        shell: bash
        run: |
          set -euxo pipefail
      
          mkdir -p "$GITHUB_WORKSPACE/$REPO_DIR"
      
          build_and_install() {
            local pkg="$1"
      
            echo "=== BUILDING $pkg ==="
      
            cd "$GITHUB_WORKSPACE/$pkg"
      
            sudo -u builder bash -c "
              cd '$GITHUB_WORKSPACE/$pkg' &&
              makepkg -sfc --noconfirm --skippgpcheck
            "
      
            PKG_FILE=$(find . -maxdepth 1 -name "*.pkg.tar.zst" | head -n1)
      
            cp "$PKG_FILE" "$GITHUB_WORKSPACE/$REPO_DIR/"

            pacman -Rdd --noconfirm mesa || true
            pacman -Rdd --noconfirm lib32-mesa || true
      
            pacman -U --noconfirm "$PKG_FILE"
          }
      
          # install missing multilib deps first
          cat >> /etc/pacman.conf << 'EOF'

          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF
          
          pacman -Sy --noconfirm lib32-gcc-libs lib32-libpciaccess
      
          build_and_install libdrm-ps4
          #build_and_install lib32-libdrm-ps4
          #build_and_install xf86-video-amdgpu-ps4
          #build_and_install mesa-ps4
          #build_and_install lib32-mesa-ps4

      - name: Create repo
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/$REPO_DIR"
          repo-add ps4-video.db.tar.zst *.pkg.tar.zst

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ps4-video-packages
          path: ${{ github.workspace }}/${{ env.REPO_DIR }}/*
          retention-days: 14

  release:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ps4-video-packages
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PS4 video packages build ${{ github.run_number }}"
          draft: true
          make_latest: false
          body: |
            Automated build of the PS4 mesa/libdrm/xf86-video-amdgpu packages, plus the pacman repo db.
          files: |
            dist/*
